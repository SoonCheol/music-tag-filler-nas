
version: "3.8"

services:
  music-tag-filler-nas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-tag-filler-nas
    ports:
      - "8000:8000"
    volumes:
      # 🎵 실제 음악 폴더 - 읽기쓰기 필수
      - /srv/music:/music:rw
      # 💾 작업 상태, 백업, .tagbak.json 기록 보관
      - /srv/docker/music-tag-filler-nas/data:/data:rw
    environment:
      - MUSIC_ROOT=/music
      - DATA_ROOT=/data
      - TZ=Asia/Seoul
    restart: unless-stopped
    # Ugreen DXP4800+는 x86_64, 메모리 넉넉 — fpcalc 위해 리소스 약간
    mem_limit: 2g

