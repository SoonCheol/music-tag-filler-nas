# EXAMPLE ONLY. Deploy as a separate agent stack; do NOT replace the music-tag-filler stack.
# Verify the existing Docker network first. No host port is published.
services:
  nas-updater-agent:
    build: ./updater_agent
    container_name: nas-updater-agent
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PORTAINER_URL: ${PORTAINER_URL:?Set_internal_Portainer_URL}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:?Set_Portainer_API_token}
      GITHUB_READ_TOKEN: ${GITHUB_READ_TOKEN:?Set_GitHub_Actions_read_token}
      UPDATER_APP_KEYS_JSON: ${UPDATER_APP_KEYS_JSON:?Set_per_app_keys_JSON}
      UPDATER_ADMIN_PASSWORD: ${UPDATER_ADMIN_PASSWORD:?Set_admin_password}
      UPDATER_CONFIG: /config/apps.json
      UPDATER_STATE_DIR: /state
    volumes:
      - ./updater_agent/apps.example.json:/config/apps.json:ro
      - updater-snapshots:/state
    networks:
      - existing-app-network
    restart: unless-stopped
networks:
  existing-app-network:
    external: true
    name: music-tag-filler_default # REPLACE with verified actual Docker network
volumes:
  updater-snapshots:
