# Verified production layout. Private repository only; see docs/CURRENT_NAS.md.
# Build the image first. Portainer stack/project name MUST be music-tag-filler-v6.
services:
  music-tag-filler-v6:
    image: music-tag-filler-nas:v6
    container_name: music-tag-filler-v6
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: /volume1/Multimedia/Music
        target: /music
        read_only: false
      - type: bind
        source: /volume3/docker3/music-tag-filler-v6/data
        target: /data
    environment:
      MUSIC_ROOT: /music
      DATA_ROOT: /data
      TZ: Asia/Seoul
    restart: unless-stopped
