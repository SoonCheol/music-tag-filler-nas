# CLI equivalent of portainer-stack.yml; do not run alongside a Portainer stack.
# docker compose -p music-tag-filler up -d --no-build --pull never
services:
  music-tag-filler:
    image: music-tag-filler-nas:v2.0.0
    container_name: music-tag-filler
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: /volume1/Multimedia/Music
        target: /music
        read_only: false
      - type: bind
        source: /volume3/docker3/music-tag-filler-v6/data
        target: /data
    environment:
      MUSIC_ROOT: /music
      DATA_ROOT: /data
      TZ: Asia/Seoul
    restart: unless-stopped
